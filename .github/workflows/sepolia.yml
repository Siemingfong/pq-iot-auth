# Gas measurement on the Sepolia testnet for the designs that need no draft precompile
# (ECDSA, P-256 via EIP-7951, LMS/HSS verified in Solidity). Runs only when started by hand.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SEPOLIA_RPC_URL      e.g. https://ethereum-sepolia-rpc.publicnode.com
#   SEPOLIA_PRIVATE_KEY  private key of a NEW wallet used only for this, funded with Sepolia ETH
name: Sepolia gas measurement

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the network, balance and estimated cost (no transactions)"
        type: boolean
        default: true
      schemes:
        description: "Schemes to measure (comma-separated)"
        type: string
        default: "ECDSA,P-256,LMS-H10-W4,LMS-H15-W4,LMS-HSS-H10W4x2"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned to the versions used in the paper)
        run: |
          pip install hsslms==0.1.3
          npm install --no-save --no-package-lock ethers@6.13.4 solc@0.8.28 @noble/curves@2.4.0 @noble/hashes@2.4.0

      - name: Measure on Sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}
          SCHEMES: ${{ inputs.schemes }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          node sepolia_measure.mjs 2>&1 | tee results-sepolia-console.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-results-${{ github.run_number }}
          path: |
            onchain/results-sepolia/
            onchain/results-sepolia-console.txt
          if-no-files-found: ignore
